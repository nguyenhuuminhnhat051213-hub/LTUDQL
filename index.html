<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Tài Liệu Học Tập</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-graduation-cap text-3xl"></i>
        <div>
          <h1 class="text-xl font-bold">Hệ Thống Quản Lý Tài Liệu Học Tập</h1>
          <p class="text-xs text-indigo-100">Đồ án môn Lập trình ứng dụng quản lý</p>
        </div>
      </div>
      <button id="openModalBtn" class="bg-white text-indigo-600 hover:bg-indigo-50 font-semibold px-4 py-2 rounded-lg transition shadow flex items-center gap-2 text-sm">
        <i class="fa-solid fa-plus"></i> Thêm tài liệu mới
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <!-- THANH THỐNG KÊ DASHBOARD -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-4 rounded-xl border border-slate-200 flex items-center gap-4 shadow-sm">
        <div class="w-12 h-12 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl">
          <i class="fa-solid fa-book"></i>
        </div>
        <div>
          <p class="text-xs text-slate-500 font-medium">Tổng số tài liệu</p>
          <h3 id="statTotal" class="text-2xl font-bold text-slate-800">0</h3>
        </div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 flex items-center gap-4 shadow-sm">
        <div class="w-12 h-12 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <div>
          <p class="text-xs text-slate-500 font-medium">Môn có tài liệu</p>
          <h3 id="statSubjects" class="text-2xl font-bold text-slate-800">0</h3>
        </div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 flex items-center gap-4 shadow-sm">
        <div class="w-12 h-12 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center text-xl">
          <i class="fa-solid fa-file-powerpoint"></i>
        </div>
        <div>
          <p class="text-xs text-slate-500 font-medium">Slide bài giảng</p>
          <h3 id="statSlides" class="text-2xl font-bold text-slate-800">0</h3>
        </div>
      </div>
    </div>

    <!-- KHỐI TÌM KIẾM & BỘ LỌC -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-3 items-center justify-between">
      <div class="relative w-full md:w-1/3">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
        <input id="searchInput" type="text" placeholder="Tìm tên tài liệu, ghi chú..." class="w-full pl-9 pr-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>
      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <select id="filterSubject" class="border px-3 py-2 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="all">Đang tải môn học...</option>
        </select>
        <select id="filterType" class="border px-3 py-2 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="all">Tất cả dạng tài liệu</option>
          <option value="Sách / Giáo trình">Sách / Giáo trình</option>
          <option value="Đề thi / Bài tập">Đề thi / Bài tập</option>
          <option value="Tóm tắt / Sơ đồ">Tóm tắt / Sơ đồ</option>
          <option value="Bài giảng Slide">Bài giảng Slide</option>
        </select>
      </div>
    </div>

    <div id="docGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    <div id="emptyNotice" class="hidden text-center py-12 text-slate-400">
      <i class="fa-regular fa-folder-open text-5xl mb-3"></i>
      <p>Chưa có tài liệu nào trong danh sách.</p>
    </div>
  </main>

  <div id="docModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 relative">
      <h2 class="text-lg font-bold mb-4 text-slate-800">Thêm tài liệu học tập</h2>
      <form id="docForm" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tên tài liệu *</label>
          <input required id="title" type="text" placeholder="Vd: Slide Git cơ bản cho người mới" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Môn học *</label>
            <select id="subject" class="w-full border px-3 py-2 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none"></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Loại tài liệu</label>
            <select id="type" class="w-full border px-3 py-2 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="Bài giảng Slide">Bài giảng Slide</option>
              <option value="Sách / Giáo trình">Sách / Giáo trình</option>
              <option value="Đề thi / Bài tập">Đề thi / Bài tập</option>
              <option value="Tóm tắt / Sơ đồ">Tóm tắt / Sơ đồ</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Đường dẫn tài liệu (Drive, Web, PDF) *</label>
          <input required id="link" type="url" placeholder="https://..." class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Ghi chú</label>
          <textarea id="notes" rows="2" placeholder="Ghi chú nội dung..." class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" id="closeModalBtn" class="px-4 py-2 border rounded-lg text-sm text-slate-600 hover:bg-slate-50">Hủy</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold">Lưu lại</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
